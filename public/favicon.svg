<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="redStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B3B"/>
      <stop offset="100%" stop-color="#D32525"/>
    </linearGradient>
    <linearGradient id="steelArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
    <linearGradient id="darkArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881B1B"/>
      <stop offset="100%" stop-color="#550E0E"/>
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D32525" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Base -->
  <rect width="100" height="100" rx="0" fill="#0A0A0A"/>
  <rect x="2" y="2" width="96" height="96" rx="0" fill="none" stroke="#D32525" stroke-width="2" stroke-opacity="0.35"/>

  <!-- 3D Geometric Monogram K matching official logo -->
  <!-- Vertical Brand Red Stem -->
  <rect x="24" y="22" width="16" height="56" rx="0" fill="url(#redStem)" filter="url(#redGlow)"/>

  <!-- Upper Metallic Stark White Arm -->
  <path d="M42 46 L68 22 L78 22 L46 54 Z" fill="url(#steelArm)"/>

  <!-- Lower Deep Red Arm -->
  <path d="M42 50 L64 78 L76 78 L48 44 Z" fill="url(#darkArm)"/>
</svg>
